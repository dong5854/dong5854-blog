<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
<rect width="1200" height="580" rx="24" fill="#f8fafc"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<text x="40" y="58" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="30" fill="#0f172a">파일 생성 다음 단계: 실제 복원 검증</text>
<text x="40" y="96" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">운영 DB 연결 없이 임시 PostgreSQL에 복원한다.</text>
<rect x="40" y="165" width="330" height="260" rx="16" fill="white" stroke="#047857" stroke-width="3"/>
<text x="62" y="205" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="24" fill="#047857">백업 PVC</text>
<text x="62" y="243" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">/backup · 읽기 전용</text>
<text x="62" y="273" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">최신 완료 .dump 선택</text>
<text x="62" y="303" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">원본 파일 변경 없음</text>
<rect x="445" y="165" width="710" height="260" rx="16" fill="white" stroke="#4f46e5" stroke-width="3"/>
<text x="467" y="205" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="24" fill="#4f46e5">검증 Pod / postgres-restore-check</text>
<text x="467" y="243" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">emptyDir: /scratch/data 에 임시 DB 생성</text>
<text x="467" y="273" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">Unix socket /scratch · 5433 · TCP 수신 안 함</text>
<text x="467" y="303" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">pg_restore --exit-on-error 실행</text>
<text x="467" y="333" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">실제 결과: restored_tables = 11</text>
<path d="M380,285 L435,285" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="40" y="540" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">검증 Job은 수동 실행한다. 운영 자격 증명과 운영 DB PVC를 전달하지 않는다.</text>
</svg>