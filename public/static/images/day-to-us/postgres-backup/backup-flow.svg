<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580">
<rect width="1200" height="580" rx="24" fill="#f8fafc"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<text x="40" y="58" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="30" fill="#0f172a">매일 한 번, 백업이 만들어지는 순서</text>
<text x="40" y="96" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">예약 → 실행 → 일관된 스냅샷 → 완료 확정 → 보관 정책 적용</text>
<rect x="40" y="160" width="250" height="150" rx="16" fill="white" stroke="#4f46e5" stroke-width="3"/>
<text x="62" y="200" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="24" fill="#4f46e5">1. CronJob</text>
<text x="62" y="238" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">03:00 / Asia/Seoul</text>
<text x="62" y="268" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">같은 작업의 중복 실행 방지</text>
<rect x="345" y="160" width="250" height="150" rx="16" fill="white" stroke="#4f46e5" stroke-width="3"/>
<text x="367" y="200" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="24" fill="#4f46e5">2. Job / Pod</text>
<text x="367" y="238" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">postgres:16-alpine</text>
<text x="367" y="268" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">db Service로 접속</text>
<rect x="650" y="160" width="500" height="150" rx="16" fill="white" stroke="#047857" stroke-width="3"/>
<text x="672" y="200" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="24" fill="#047857">3. pg_dump → .partial</text>
<text x="672" y="238" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">DB 스키마와 데이터를 압축 아카이브로 작성</text>
<text x="672" y="268" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">운영 앱과 별도의 읽기 전용 스냅샷</text>
<rect x="345" y="365" width="805" height="110" rx="16" fill="white" stroke="#047857" stroke-width="3"/>
<text x="367" y="405" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="24" fill="#047857">4. 목록 검사 → .dump로 변경 → 오래된 파일 정리</text>
<text x="367" y="443" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">새 백업에 실패하면 기존 완료 백업의 만료 정리로 진행하지 않는다.</text>
<path d="M295,235 L335,235" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600,235 L640,235" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M900,315 L900,355" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="40" y="540" font-family="Arial,Apple SD Gothic Neo,Malgun Gothic,sans-serif" font-size="20" fill="#334155">Job 이력 3개와 백업 파일 30일은 다른 설정이다. 수동 실행을 포함하면 하루에 여러 파일이 생긴다.</text>
</svg>